<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>tcli</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="explorer">
      <header id="cwd"></header>
      <input id="file-filter" type="search" placeholder="筛选当前目录…" aria-label="筛选文件" />
      <ul id="files"></ul>
      <div id="explorer-message" role="status"></div>
      <div class="explorer-help dim">点击打开 · 右键操作 · Alt+点击插入路径</div>
    </aside>
    <main>
      <nav id="projects"></nav>
      <nav id="tabs"></nav>
      <div id="terms"></div>
    </main>
    <aside id="side">
      <section id="procs-box">
        <header>系统 <small id="uptime"></small></header>
        <div id="cores"></div>
        <div id="meters"></div>
        <header class="sub">进程 <small id="proc-count"></small>
          <small class="sorts">排序: <a id="s-cpu" class="on">CPU</a> <a id="s-mem">内存</a> · <span id="kill-shortcut">K</span> 结束</small></header>
        <ul id="procs"></ul>
        <footer id="proc-msg"></footer>
      </section>
      <section id="stats-box">
        <header>Magpie 路由 <small id="magpie-status">连接中…</small></header>
        <ul id="routes"><li class="dim">正在读取路由…</li></ul>
      </section>
      <footer id="app-update">
        <span id="build-mode" class="dim">检查版本…</span>
        <button id="settings" title="设置快捷键">设置</button>
        <button id="update-app" hidden>更新并重启</button>
      </footer>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
